[module]
tab							= "<i class=\"fa fa-fw fa-plug\"></i>&nbsp;Account connections"

[statuses]
0							= "not connected"
1							= "connected"

[index]
heading						= "Connections with OAuth2 providers"
headProvider				= "Provider"
headStatus					= "Connection"
headAction					= ""
buttonAdd					= "connect"
buttonRemove				= "disconnect"
empty						= "No OAuth2 providers available."

[add]
msgSuccess					= "<strong>Your user account has been connected with your %1$s account.</strong><br/>In future, you can log in faster using this provider."
msgErrorResponded			= "<strong>The connection failed.</strong><br/>%1$s responded with an error (%2$s). The administration has been informed.<br/>Please try again later."
msgErrorInvalidState		= "Invalid state during authentication. Please try again."
msgErrorAlreadyConnected	= "<strong>The connection failed.</strong><br/>This %1$s account is already connected with another user account (%1$s)."
msgException				= "Unexpected error. The administration has been informed about this incident."

[remove]
msgSuccess					= "The connection with the %1$s account has been removed."
msgErrorNotConnected		= "Your user account is not connected with a %1$s account."
